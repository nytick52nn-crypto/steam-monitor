services:
  steam-monitor:
    build: .
    container_name: steam-monitor
    restart: unless-stopped

    env_file:
      - .env

    environment:
      - DATA_DIR=/app/data
      - DATABASE_URL=sqlite:////app/data/steam_cards.db

    volumes:
      - ./data:/app/data
      - ./charts:/app/charts
      - ./logs:/app/logs

    ports:
      - "8501:8501"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
